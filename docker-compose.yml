# 로컬 개발용 PostgreSQL — 값은 루트 .env 에서 읽는다 (.env.example 참고)
services:
  postgres:
    image: postgres:16-alpine
    container_name: ims_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ims}
      POSTGRES_USER: ${DB_USERNAME:-ims_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
